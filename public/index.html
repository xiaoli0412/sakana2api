<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakana Chat · 管理面板</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161822; --card: #1c1e2e; --border: #2a2d3e;
    --fg: #e4e6f0; --dim: #8b8fa3; --acc: #4f8cff; --acc2: #a371f7;
    --user: #1f6feb; --err: #f85149; --ok: #3fb950; --warn: #d29922;
    --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; overflow: hidden;
  }
  a { color: var(--acc); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---- sidebar ---- */
  .sidebar {
    width: 56px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px; flex-shrink: 0;
  }
  .sidebar .logo { font-size: 22px; margin-bottom: 8px; }
  .sidebar button {
    background: transparent; border: none; color: var(--dim); cursor: pointer;
    width: 40px; height: 40px; border-radius: 10px; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; position: relative;
  }
  .sidebar button:hover { color: var(--fg); background: var(--card); }
  .sidebar button.active { color: var(--acc); background: rgba(79,140,255,.12); }
  .sidebar button .badge {
    position: absolute; top: 2px; right: 2px; font-size: 9px;
    background: var(--err); color: #fff; border-radius: 8px; padding: 1px 5px; min-width: 14px; text-align: center;
  }
  .sidebar .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: auto; margin-bottom: 8px; }
  .sidebar .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .sidebar .dot.err { background: var(--err); }

  /* ---- main ---- */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 18px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .topbar h1 { font-size: 15px; font-weight: 600; }
  .topbar h1 span { color: var(--acc2); }
  .topbar .spacer { flex: 1; }
  .topbar .status { font-size: 12px; color: var(--dim); }
  .topbar select {
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer;
  }

  .content { flex: 1; overflow-y: auto; padding: 20px; }

  /* ---- cards ---- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; transition: border-color .2s;
  }
  .card:hover { border-color: var(--acc); }
  .card .lab { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .card .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .sub { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  .card .bar { margin-top: 6px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .card .bar i { display: block; height: 100%; border-radius: 2px; transition: width .5s; }
  .card .bar.green i { background: linear-gradient(90deg, #3fb950, #56d364); }
  .card .bar.blue i { background: linear-gradient(90deg, #4f8cff, #79b8ff); }
  .card .bar.purple i { background: linear-gradient(90deg, #a371f7, #d2a8ff); }

  /* ---- tables ---- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; }
  tr:hover td { background: var(--card); }
  .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 20px; border: 1px solid var(--border); }
  .pill.on { color: var(--ok); border-color: rgba(63,185,80,.5); }
  .pill.off { color: var(--dim); }
  .pill.rev { color: var(--err); border-color: rgba(248,81,73,.5); }
  .pill.rate { color: var(--warn); border-color: rgba(210,153,34,.5); }

  h2 { font-size: 15px; margin: 22px 0 10px; }
  h2 .count { color: var(--dim); font-size: 12.5px; font-weight: 400; }

  .btn {
    background: var(--card); border: 1px solid var(--border); color: var(--fg);
    border-radius: 8px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--acc); }
  .btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
  .btn.primary:hover { background: #3d78e8; }
  .btn.danger { border-color: rgba(248,81,73,.5); color: var(--err); }
  .btn.sm { padding: 3px 10px; font-size: 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  input[type=text], input[type=password] {
    background: var(--card); border: 1px solid var(--border); color: var(--fg);
    border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13px; outline: none;
  }
  input:focus { border-color: var(--acc); }
  .muted { color: var(--dim); font-size: 12.5px; }
  .errbox { color: var(--err); font-size: 13px; padding: 8px; background: rgba(248,81,73,.08); border-radius: 8px; margin: 8px 0; }
  .keyv {
    display: flex; align-items: center; gap: 8px; background: #0a0e14; border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12.5px; word-break: break-all;
  }
  .toast {
    position: fixed; top: 14px; right: 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 16px; font-size: 13px; z-index: 99; display: none;
    box-shadow: var(--shadow); max-width: 420px;
  }
  .toast.show { display: block; animation: slideIn .2s ease; }
  .toast.ok b { color: var(--ok); } .toast.err b { color: var(--err); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  [hidden] { display: none !important; }

  /* ---- chat ---- */
  .chat-area { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; height: 100%; }
  .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 16px; }
  .msg { display: flex; gap: 12px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 30px;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    background: var(--card); border: 1px solid var(--border);
  }
  .msg.user .avatar { background: #1f3a5f; border-color: var(--user); }
  .bubble {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; min-width: 0; max-width: 100%; overflow-wrap: break-word;
  }
  .msg.user .bubble { background: #11253f; }
  .bubble .who { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .reasoning {
    border-left: 3px solid var(--acc2); padding: 6px 12px; margin: 8px 0;
    color: var(--dim); font-size: 13px; white-space: pre-wrap; border-radius: 0 8px 8px 0;
    background: rgba(163,113,247,.06);
  }
  .cite { display: inline-block; font-size: 11px; color: var(--acc); margin: 2px 6px 2px 0;
    text-decoration: none; border: 1px solid rgba(79,140,255,.4); border-radius: 20px; padding: 1px 9px; }
  .file-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim);
    border: 1px dashed var(--border); border-radius: 8px; padding: 4px 10px; margin: 4px 8px 4px 0;
  }
  .file-chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
  .toolturn { margin: 4px 0; font-size: 12.5px; color: var(--acc2);
    background: rgba(163,113,247,.08); border-radius: 8px; padding: 6px 12px; white-space: pre-wrap; }
  pre { background: #0a0e14; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; overflow-x: auto; margin: 8px 0; font-size: 12.5px; }
  code { font-family: "Cascadia Code", Consolas, monospace; }
  p code { background: #21262d; border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--acc); }
  @keyframes blink { 50% { opacity: 0; } }

  .inputbar {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
  }
  .inputbar textarea {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--fg); font: inherit; max-height: 140px; padding: 6px 4px;
  }
  .iconbtn {
    background: var(--panel); border: 1px solid var(--border); color: var(--dim);
    border-radius: 8px; width: 34px; height: 34px; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .iconbtn:hover:not(:disabled) { color: var(--fg); border-color: var(--acc); }
  .iconbtn:disabled { opacity: .4; cursor: not-allowed; }
  .iconbtn.send { background: var(--acc); border-color: var(--acc); color: #fff; }
  .iconbtn.send:hover:not(:disabled) { background: #3d78e8; }

  .empty-chat { text-align: center; color: var(--dim); margin-top: 15vh; padding: 40px; }
  .empty-chat .big { font-size: 48px; margin-bottom: 12px; }

  .audit-row { cursor: pointer; }
  .audit-detail { display: none; background: #0a0e14; border-radius: 8px; padding: 12px; margin: 4px 0; font-size: 12px; white-space: pre-wrap; max-height: 300px; overflow: auto; }
  .audit-detail.show { display: block; }

  @media (max-width: 700px) {
    .sidebar { width: 48px; }
    .sidebar button { width: 36px; height: 36px; font-size: 16px; }
  }
</style>
</head>
<body>
<nav class="sidebar">
  <div class="logo">🐟</div>
  <button data-tab="chat" class="active" title="聊天">💬</button>
  <button data-tab="dash" title="监控">📊</button>
  <button data-tab="audit" title="请求日志">📋</button>
  <button data-tab="keys" title="密钥">🔑</button>
  <button data-tab="accounts" title="账户">👤</button>
  <span class="dot" id="dot"></span>
</nav>

<div class="main">
  <div class="topbar">
    <h1>🐟 <span>sakana-panel</span></h1>
    <span class="status" id="status">连接中…</span>
    <span class="spacer"></span>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)">模型
      <select id="model"><option value="sakana-namazu">加载中…</option></select>
    </label>
    <button class="iconbtn" id="newchat" title="新会话" style="width:32px;height:32px;font-size:14px;background:var(--card)">＋</button>
  </div>

  <div class="content">
    <!-- ======== TAB: CHAT ======== -->
    <div data-pane="chat" class="chat-area">
      <div class="msgs" id="msgs">
        <div class="empty-chat" id="empty">
          <div class="big">🐟</div>
          <p>免费 AI 对话 · 管理面板</p>
          <p class="muted" style="margin-top:8px">流式 / 思考链 / Web 搜索 / 图片 / 文件 / 多轮记忆</p>
        </div>
      </div>
      <div id="attachments" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
      <div class="inputbar">
        <textarea id="input" rows="1" placeholder="输入消息…(Enter 发送, Shift+Enter 换行)"></textarea>
        <div style="display:flex;gap:6px;">
          <button class="iconbtn" id="attach" title="上传文件">📎</button>
          <button class="iconbtn send" id="send" title="发送">➤</button>
        </div>
      </div>
    </div>

    <!-- ======== TAB: DASHBOARD ======== -->
    <div data-pane="dash" hidden>
      <div class="cards" id="dashCards"></div>
      <h2>请求统计 <span class="count" id="dashLast"></span></h2>
      <div id="dashBars" style="margin-bottom:16px"></div>
      <h2>运行状态</h2>
      <table id="dashTable"></table>
    </div>

    <!-- ======== TAB: AUDIT ======== -->
    <div data-pane="audit" hidden>
      <div class="row">
        <span class="muted">最近 100 条请求记录</span>
        <button class="btn sm" id="auditRefresh">刷新</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>时间</th><th>方法</th><th>路径</th><th>模型</th><th>状态</th><th>耗时</th><th>操作</th></tr></thead>
        <tbody id="auditRows"></tbody>
      </table></div>
    </div>

    <!-- ======== TAB: KEYS ======== -->
    <div data-pane="keys" hidden>
      <div id="keyLock" hidden>
        <div class="row"><input type="password" id="adminKey" placeholder="管理 API_KEY" style="flex:1;max-width:360px">
          <button class="btn primary" id="adminUnlock">解锁</button></div>
        <p class="muted">未设置 API_KEY 时面板可直开。</p>
      </div>
      <div id="keyBody" hidden>
        <div class="row"><input type="text" id="keyName" placeholder="Key 名称" style="flex:1;max-width:360px">
          <button class="btn primary" id="keyCreate">生成 Key</button></div>
        <div id="keyNew" hidden></div>
        <div class="table-wrap"><table>
          <thead><tr><th>名称</th><th>前缀</th><th>状态</th><th>创建</th><th>最近使用</th><th>操作</th></tr></thead>
          <tbody id="keyRows"></tbody>
        </table></div>
        <p class="muted" id="keyHint"></p>
      </div>
    </div>

    <!-- ======== TAB: ACCOUNTS ======== -->
    <div data-pane="accounts" hidden>
      <div class="row">
        <span class="muted">上游账户池 · 各账户独立会话</span>
        <button class="btn sm" id="accRefresh">刷新</button>
      </div>
      <div class="cards" id="accCards"></div>
      <div class="table-wrap"><table>
        <thead><tr><th>邮箱</th><th>UID</th><th>状态</th><th>Cookie</th><th>存活</th></tr></thead>
        <tbody id="accRows"></tbody>
      </table></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.xml,.yaml,.yml,.log,.sh,.env,.sql,.rb,.go,.java,.c,.cpp,.h,.rs,.toml,.ini,.cfg" multiple hidden>

<script>
'use strict';
const $ = id => document.getElementById(id);
const msgs = $('msgs'), input = $('input'), sendBtn = $('send');
let conversationId = null, busy = false;

function toast(msg, kind = 'ok') {
  const t = $('toast');
  t.className = 'toast show ' + kind;
  t.innerHTML = '<b>' + (kind === 'ok' ? '✓ ' : '⚠ ') + '</b>' + msg;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 3500);
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderMd(text) {
  let html = esc(text);
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => {
    const c = code.split('\n'); const lang = (c[0] || '').trim().replace(/\W/g, '');
    return `<pre><code>${esc(c.slice(lang ? 1 : 0).join('\n'))}</code></pre>`;
  });
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
  html = html.replace(/\n{2,}/g, '</p><p>');
  return '<p>' + html + '</p>';
}

/* ---------- chat ---------- */
function addMsg(role) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `<div class="avatar">${role === 'user' ? '🧑' : '🐟'}</div><div class="bubble"><div class="who"><b>${role === 'user' ? '你' : 'Sakana'}</b></div><div class="body"></div></div>`;
  msgs.appendChild(el);
  scrollBottom();
  return el.querySelector('.body');
}
function scrollBottom() { document.querySelector('.content').scrollTop = document.querySelector('.content').scrollHeight; }
function removeTyping() { const t = msgs.querySelector('.typing'); if (t) t.classList.remove('typing'); }

const attachments = [];
$('attach').onclick = () => $('file').click();
$('file').onchange = (e) => {
  for (const file of e.target.files) {
    const reader = new FileReader();
    reader.onload = () => {
      attachments.push({ name: file.name, dataUrl: reader.result });
      const chip = document.createElement('span');
      chip.className = 'file-chip';
      const isImg = file.type.startsWith('image/');
      chip.innerHTML = (isImg ? `<img src="${reader.result}">` : '📄') + `<span>${esc(file.name)}</span><button class="iconbtn" style="width:20px;height:20px;font-size:12px">✕</button>`;
      chip.querySelector('button').onclick = () => {
        const i = attachments.findIndex(a => a.name === file.name && a.dataUrl === reader.result);
        if (i >= 0) attachments.splice(i, 1);
        chip.remove();
      };
      $('attachments').appendChild(chip);
    };
    reader.readAsDataURL(file);
  }
  e.target.value = '';
};

async function send() {
  const text = input.value.trim();
  if (!text && !attachments.length) return;
  if (busy) return;
  const savedFiles = [...attachments];
  const userBody = addMsg('user');
  userBody.appendChild(document.createTextNode(text));
  for (const f of savedFiles) {
    const chip = document.createElement('span');
    chip.className = 'file-chip';
    const isImg = f.dataUrl.startsWith('data:image/');
    chip.innerHTML = (isImg ? `<img src="${f.dataUrl}">` : '📄') + `<span>${esc(f.name)}</span>`;
    userBody.appendChild(chip);
  }
  $('attachments').innerHTML = ''; attachments.length = 0;
  input.value = ''; input.style.height = 'auto';
  setBusy(true);

  const content = [];
  if (text) content.push({ type: 'text', text });
  for (const f of savedFiles) {
    if (f.dataUrl.startsWith('data:image/')) {
      content.push({ type: 'image_url', image_url: { url: f.dataUrl } });
    } else {
      content.push({ type: 'file', name: f.name, data: f.dataUrl });
    }
  }
  const body = { model: $('model').value, messages: [{ role: 'user', content: (text && !savedFiles.length) ? text : content }], stream: true };
  if (conversationId) body.conversation_id = conversationId;

  const aiBody = addMsg('assistant');
  aiBody.classList.add('typing');
  let reasoning = '', answer = '', cites = [], gotReasoning = false;

  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    });
    const newConv = resp.headers.get('x-conversation-id');
    if (newConv) conversationId = newConv;
    if (!resp.ok || !resp.body) {
      const e = await resp.json().catch(() => ({}));
      throw new Error(e.error?.message || ('HTTP ' + resp.status));
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        let o; try { o = JSON.parse(payload); } catch { continue; }
        const delta = o.choices?.[0]?.delta || {};
        if (delta.reasoning_content) { gotReasoning = true; reasoning += delta.reasoning_content; }
        else if (delta.content) {
          removeTyping();
          answer += delta.content;
          aiBody.innerHTML = '';
          aiBody.appendChild(document.createTextNode(answer));
          scrollBottom();
        } else if (delta.tool_turn_text) {
          const d = document.createElement('div');
          d.className = 'toolturn';
          d.textContent = '🔧 ' + delta.tool_turn_text;
          aiBody.insertBefore(d, aiBody.firstChild);
        }
        if (o.citations) cites = o.citations;
      }
    }
    removeTyping();
    aiBody.innerHTML = '';
    if (gotReasoning) {
      const r = document.createElement('details');
      r.className = 'reasoning';
      r.innerHTML = '<summary>💭 思维链</summary>';
      const p = document.createElement('div');
      p.style.whiteSpace = 'pre-wrap';
      p.textContent = reasoning;
      r.appendChild(p);
      aiBody.appendChild(r);
    }
    if (answer) {
      const div = document.createElement('div');
      div.innerHTML = renderMd(answer);
      aiBody.appendChild(div);
    }
    if (cites.length) {
      const meta = document.createElement('div');
      meta.style.cssText = 'margin-top:8px;font-size:11px;color:var(--dim)';
      meta.textContent = '来源 ';
      for (const c of cites) {
        const a = document.createElement('a');
        a.className = 'cite';
        a.href = c.url || '#'; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = '🔗 ' + (c.title || c.url);
        meta.appendChild(a);
      }
      aiBody.appendChild(meta);
    }
    scrollBottom();
  } catch (e) {
    removeTyping();
    aiBody.innerHTML = '';
    const err = document.createElement('div');
    err.style.cssText = 'color:var(--err)';
    err.textContent = '⚠️ ' + e.message;
    aiBody.appendChild(err);
  }
  setBusy(false);
}
function setBusy(b) { busy = b; sendBtn.disabled = b; $('attach').disabled = b; input.disabled = b; }
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
sendBtn.onclick = send;
$('newchat').onclick = () => {
  conversationId = null;
  msgs.innerHTML = '';
  msgs.appendChild($('empty'));
  $('empty').style.display = '';
  input.focus();
};

/* ---------- tabs ---------- */
document.querySelectorAll('.sidebar button[data-tab]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.sidebar button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== b.dataset.tab; });
    if (b.dataset.tab === 'dash') refreshDash();
    if (b.dataset.tab === 'audit') refreshAudit();
    if (b.dataset.tab === 'keys') refreshKeys();
    if (b.dataset.tab === 'accounts') refreshAccounts();
  };
});

/* ---------- models ---------- */
async function loadModels() {
  try {
    const r = await fetch('/v1/models');
    const j = await r.json();
    const list = (j.data || []).filter(m => m.id);
    if (!list.length) return;
    const sel = $('model');
    sel.innerHTML = '';
    const groups = { 'Namazu 🐟': [], 'Fugu 🐡': [] };
    for (const m of list) {
      const g = m.id.startsWith('sakana-fugu') ? 'Fugu 🐡' : 'Namazu 🐟';
      groups[g].push(m);
    }
    for (const [g, ms] of Object.entries(groups)) {
      if (!ms.length) continue;
      const og = document.createElement('optgroup');
      og.label = g;
      for (const m of ms) {
        const op = document.createElement('option');
        op.value = m.id;
        op.textContent = m.id + ' — ' + (m.description || '').replace(/^[^·]+·\s*/, '');
        og.appendChild(op);
      }
      sel.appendChild(og);
    }
  } catch { /* keep placeholder */ }
}

/* ---------- dashboard ---------- */
function fmtTime(sec) {
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm';
  return (sec / 3600).toFixed(1) + 'h';
}
function fmtDT(ts) { return ts ? new Date(ts).toLocaleString() : '—'; }
function fmtK(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }

async function refreshDash() {
  const st = await (await fetch('/api/stats')).json().catch(() => null);
  if (!st) { $('dashCards').innerHTML = '<div class="errbox">无法获取统计</div>'; return; }
  const s = st.session;
  const errPct = st.requests.total ? Math.round(100 * st.requests.err / st.requests.total) : 0;
  $('dashCards').innerHTML = `
    <div class="card"><div class="lab">🟢 服务</div><div class="val">${st.requests.err === 0 ? '正常' : '异常'}</div>
      <div class="sub">运行 ${fmtTime(st.uptimeSec)}</div></div>
    <div class="card"><div class="lab">💬 请求</div><div class="val">${fmtK(st.requests.total)}</div>
      <div class="sub">成功 ${st.requests.ok} · 错误 ${st.requests.err} (${errPct}%)</div></div>
    <div class="card"><div class="lab">🧮 输出 Token</div><div class="val">${fmtK(st.tokens.completion)}</div>
      <div class="sub">输入 ${fmtK(st.tokens.prompt)}</div></div>
    <div class="card"><div class="lab">🗂 会话</div><div class="val">${st.conversations}</div>
      <div class="sub">本进程新建</div></div>
    <div class="card"><div class="lab">💾 缓存</div><div class="val">${st.cache?.size || 0}</div>
      <div class="sub">命中率 ${st.cache?.hitRate || '0%'}</div></div>
    <div class="card"><div class="lab">👤 账户池</div><div class="val">${st.accounts?.active || 0}/${st.accounts?.total || 0}</div>
      <div class="sub">活跃/总计</div></div>
    ${s ? `<div class="card"><div class="lab">🔐 会话</div><div class="val" style="font-size:16px">${s.loggedIn ? '已登录 ✅' : '未登录 ❌'}</div>
      <div class="sub">${s.email || s.uid || '—'} · Cookie ${s.cookieCount}个</div></div>` : ''}
  `;
  const byModel = Object.entries(st.byModel || {});
  const maxR = Math.max(1, ...byModel.map(([, v]) => v.requests));
  $('dashBars').innerHTML = byModel.length
    ? byModel.map(([m, v]) => `<div style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px">
      <span style="width:160px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m)}</span>
      <div style="flex:1;background:var(--card);border-radius:6px;height:14px;overflow:hidden">
        <i style="display:block;height:100%;width:${Math.round(100 * v.requests / maxR)}%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px"></i></div>
      <span style="width:140px;text-align:right;font-variant-numeric:tabular-nums">${v.requests} 次 / ${fmtK(v.charsOut)}ch</span></div>`).join('')
    : '<p class="muted">暂无请求数据</p>';
  $('dashLast').textContent = '最后更新 ' + new Date().toLocaleTimeString();
  $('dashTable').innerHTML = `
    <tbody>
      <tr><td>上次错误</td><td class="mono">${st.lastErr ? esc(String(st.lastErr)) + ' @ ' + fmtDT(st.lastErrAt) : '无'}</td></tr>
      <tr><td>鉴权模式</td><td>${st.accounts?.active ? 'Key 模式' : '开放模式'}</td></tr>
      <tr><td>API 基址</td><td class="mono">${location.origin}/v1</td></tr>
    </tbody>`;
}

/* ---------- audit ---------- */
async function refreshAudit() {
  try {
    const r = await fetch('/api/audit');
    const j = await r.json();
    const entries = j.entries || [];
    $('auditRows').innerHTML = entries.length
      ? entries.map(e => {
          const err = e.error ? ' (⚠ ' + esc(e.error.slice(0, 60)) + ')' : '';
          return `<tr class="audit-row" data-id="${esc(e.id)}">
            <td class="mono" style="font-size:11px">${fmtDT(e.ts)}</td>
            <td>${e.method}</td>
            <td class="mono" style="font-size:11px">${esc(e.path)}</td>
            <td style="font-size:12px">${esc(e.model)}</td>
            <td><span class="pill ${e.status < 300 ? 'on' : 'rev'}">${e.status}</span></td>
            <td class="mono">${e.duration}ms</td>
            <td><button class="btn sm" onclick="toggleAudit('${e.id}')">查看</button></td></tr>
            <tr id="audit-${e.id}" class="audit-detail">
              <td colspan="7"><div class="mono">REQ: ${esc(e.reqBody || '')}\n\nRES: ${esc(e.resBody || '')}${err}</div></td></tr>`;
        }).join('')
      : '<tr><td colspan="7" class="muted" style="text-align:center;padding:30px">暂无请求记录</td></tr>';
  } catch { $('auditRows').innerHTML = '<tr><td colspan="7" class="errbox">加载失败</td></tr>'; }
}
function toggleAudit(id) {
  const el = document.getElementById('audit-' + id);
  if (el) el.classList.toggle('show');
}
$('auditRefresh').onclick = refreshAudit;

/* ---------- keys ---------- */
let adminUnlocked = !!sessionStorage.getItem('sakAdminKey');
const sakKey = () => sessionStorage.getItem('sakAdminKey') || '';
function adminHeader() { return adminUnlocked && sakKey() ? { 'authorization': 'Bearer ' + sakKey() } : {}; }
function api(url, opts = {}) { return fetch(url, { ...opts, headers: { ...adminHeader(), ...(opts.headers || {}) } }); }

$('adminUnlock').onclick = async () => {
  const v = $('adminKey').value.trim();
  if (!v) return;
  try {
    const r = await fetch('/api/keys', { headers: { 'authorization': 'Bearer ' + v } });
    if (r.ok) { adminUnlocked = true; sessionStorage.setItem('sakAdminKey', v); toast('管理员解锁成功'); refreshKeys(); }
    else toast('管理密钥无效', 'err');
  } catch { toast('请求失败', 'err'); }
};
async function refreshKeys() {
  const r = await fetch('/api/keys', { headers: adminHeader() });
  if (r.status === 403) { $('keyLock').hidden = false; $('keyBody').hidden = true; return null; }
  if (r.status === 401) { sessionStorage.removeItem('sakAdminKey'); adminUnlocked = false; $('keyLock').hidden = false; $('keyBody').hidden = true; return null; }
  const data = await r.json();
  $('keyLock').hidden = true;
  $('keyBody').hidden = false;
  $('keyHint').textContent = data.open
    ? '当前为开放模式。创建 Key 后接口将要求 Bearer 认证。'
    : `已启用 Key 认证(${data.keys.length} 个, 活跃 ${data.keys.filter(k => !k.revoked).length} 个)。`;
  $('keyRows').innerHTML = data.keys.map(k => `
    <tr><td>${esc(k.name)}</td><td class="mono">${esc(k.prefix)}…</td>
      <td><span class="pill ${k.revoked ? 'rev' : 'on'}">${k.revoked ? '已撤销' : '活跃'}</span></td>
      <td>${fmtDT(k.created)}</td><td>${k.lastUsed ? fmtDT(k.lastUsed) : '—'}</td>
      <td>${k.revoked ? '' : `<button class="btn sm danger" onclick="revokeKey('${k.id}')">撤销</button>`}</td></tr>`).join('') || '<tr><td colspan="6" class="muted" style="text-align:center">暂无 Key</td></tr>';
}
async function revokeKey(id) {
  if (!confirm('撤销该 Key? 立即失效。')) return;
  const r = await fetch('/api/keys/' + id + '/revoke', { method: 'POST', headers: adminHeader() });
  if (r.ok) { toast('已撤销'); refreshKeys(); } else toast('操作失败', 'err');
}
$('keyCreate').onclick = async () => {
  const name = $('keyName').value.trim() || 'key-' + Date.now().toString(36);
  const r = await fetch('/api/keys', { method: 'POST', headers: { 'content-type': 'application/json', ...adminHeader() }, body: JSON.stringify({ name }) });
  if (r.status === 403) { toast('需要管理密钥', 'err'); return; }
  const j = await r.json();
  if (!j.key) { toast('创建失败', 'err'); return; }
  $('keyName').value = '';
  if (!adminUnlocked) { sessionStorage.setItem('sakAdminKey', j.key); adminUnlocked = true; }
  $('keyNew').hidden = false;
  $('keyNew').innerHTML = `<div class="keyv">${esc(j.key)} <button class="btn sm" onclick="navigator.clipboard.writeText('${j.key}');toast('已复制')">复制</button></div>
    <p class="muted">⚠️ 只显示一次。</p>`;
  refreshKeys();
};

/* ---------- accounts ---------- */
async function refreshAccounts() {
  try {
    const r = await fetch('/api/accounts');
    const j = await r.json();
    const list = j.accounts || [];
    $('accCards').innerHTML = `
      <div class="card"><div class="lab">👤 总计</div><div class="val">${j.total}</div></div>
      <div class="card"><div class="lab">✅ 活跃</div><div class="val">${j.active}</div></div>
      <div class="card"><div class="lab">⏳ 限流</div><div class="val">${list.filter(a => a.state === 'rate_limited').length}</div></div>
      <div class="card"><div class="lab">❌ 过期</div><div class="val">${list.filter(a => a.state === 'expired').length}</div></div>`;
    $('accRows').innerHTML = list.length
      ? list.map(a => {
          const statePill = a.state === 'active' ? 'on' : a.state === 'rate_limited' ? 'rate' : 'rev';
          const stateLabel = a.state === 'active' ? '活跃' : a.state === 'rate_limited' ? '限流' : '过期';
          return `<tr><td>${esc(a.email || '—')}</td><td class="mono" style="font-size:11px">${esc((a.uid || '').slice(0, 16))}</td>
            <td><span class="pill ${statePill}">${stateLabel}</span></td>
            <td>${a.cookies?.length || 0}</td>
            <td>${a.savedAt ? fmtTime(Math.floor((Date.now() - a.savedAt) / 1000)) : '—'}</td></tr>`;
        }).join('')
      : '<tr><td colspan="5" class="muted" style="text-align:center;padding:30px">暂无账户</td></tr>';
  } catch { $('accRows').innerHTML = '<tr><td colspan="5" class="errbox">加载失败</td></tr>'; }
}
$('accRefresh').onclick = refreshAccounts;

/* ---------- health ---------- */
async function health() {
  try {
    const r = await api('/health');
    if ((await r.json()).ok) { $('dot').classList.add('ok'); $('dot').classList.remove('err'); $('status').textContent = '在线'; }
  } catch { $('dot').classList.add('err'); $('dot').classList.remove('ok'); $('status').textContent = '离线'; }
}
health();
loadModels();
setInterval(health, 30000);
setInterval(() => { const p = document.querySelector('[data-pane="dash"]'); if (!p.hidden) refreshDash(); }, 10000);
input.focus();
</script>
</body>
</html>
