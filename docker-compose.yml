services:
  sakana-2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sakana-2api:0.13.0
    container_name: sakana-2api
    restart: unless-stopped
    init: true
    mem_limit: ${MEMORY_LIMIT:-2g}
    memswap_limit: ${MEMORY_SWAP_LIMIT:-2g}
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      AUTO_SESSION: "true"
      API_KEY: ${API_KEY:?set API_KEY in .env}
      ACCOUNT_POOL_MIN: ${ACCOUNT_POOL_MIN:-50}
      ACCOUNT_POOL_MAX: ${ACCOUNT_POOL_MAX:-50}
      ACCOUNT_POOL_CRITICAL: ${ACCOUNT_POOL_CRITICAL:-10}
      ACCOUNT_REFRESH_MS: ${ACCOUNT_REFRESH_MS:-1200000}
      ACCOUNT_REPLENISH_MS: ${ACCOUNT_REPLENISH_MS:-90000}
      ACCOUNT_STALE_MS: ${ACCOUNT_STALE_MS:-900000}
      RATE_LIMIT_COOLDOWN_MS: ${RATE_LIMIT_COOLDOWN_MS:-600000}
      HARVEST_RETRIES: ${HARVEST_RETRIES:-3}
      HARVEST_RETRY_DELAY_MS: ${HARVEST_RETRY_DELAY_MS:-5000}
      HARVEST_BACKOFF_MS: ${HARVEST_BACKOFF_MS:-300000}
      MAX_CONCURRENT_PER_ACCOUNT: ${MAX_CONCURRENT_PER_ACCOUNT:-6}
      QUEUE_TIMEOUT_MS: ${QUEUE_TIMEOUT_MS:-60000}
      ACCOUNT_TOMBSTONE_TTL_MS: ${ACCOUNT_TOMBSTONE_TTL_MS:-86400000}
      SAKANA_SESSION_FILE: /app/runtime/session.json
      SAKANA_ACCOUNT_POOL_FILE: /app/runtime/account_pool.json
      DISPLAY: :99
    volumes:
      - type: bind
        source: ./runtime
        target: /app/runtime
        bind:
          create_host_path: true
      - type: bind
        source: ./character_cards
        target: /app/character_cards
        bind:
          create_host_path: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        runtime=/app/runtime
        mkdir -p "$$runtime"
        for name in session.json account_pool.json account_pool.remote.json keys.json tempmail.json tokens.json; do
          if [ -f "/app/$$name" ] && [ ! -e "$$runtime/$$name" ]; then
            cp -p "/app/$$name" "$$runtime/$$name"
          fi
          rm -rf "/app/$$name"
          ln -s "$$runtime/$$name" "/app/$$name"
        done
        if [ -d /app/.browser-profile ] && [ ! -L /app/.browser-profile ] && [ ! -e "$$runtime/.browser-profile" ]; then
          mkdir -p "$$runtime/.browser-profile"
          cp -a /app/.browser-profile/. "$$runtime/.browser-profile/"
        fi
        rm -rf /app/.browser-profile
        mkdir -p "$$runtime/.browser-profile"
        ln -s "$$runtime/.browser-profile" /app/.browser-profile
        exec /usr/local/bin/sakana-entrypoint.sh
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
